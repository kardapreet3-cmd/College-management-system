<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>College Management System - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1677ff;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #1677ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d5dcc;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
        }

        .signup a {
            color: #1677ff;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>College Management System</h1>

    <h2>Login</h2>


    <form action="/login" method="POST">


        <!-- ROLE -->

        <label>Select Role</label>

        <select name="role" required>

            <option value="">
                Select Role
            </option>

            <option value="student">
                Student
            </option>

            <option value="faculty">
                Faculty
            </option>

            <option value="admin">
                Administrator
            </option>

            <option value="hod">
                HOD
            </option>

            <option value="librarian">
                Librarian
            </option>

        </select>


        <!-- USERNAME -->

        <label>Username</label>

        <input type="text"
               name="username"
               placeholder="Enter Username"
               required>


        <!-- PASSWORD -->

        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>


        <button type="submit">
            Login
        </button>

    </form>


    <div class="signup">

        Don't have an account?

        <a href="/signin">
            Sign Up
        </a>

    </div>

</div>

</body>

</html>
