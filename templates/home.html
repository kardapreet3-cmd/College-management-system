<!DOCTYPE html>
<html>
<head>
    <title>College Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        .header {
            background: #1677ff;
            color: white;
            padding: 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            margin-top: 80px;
        }

        .btn {
            display: inline-block;

            background: #1677ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
        }

        .btn:hover {
            background: #0056d6;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🏫 College Management System</h1>
    </div>

    <div class="container">

        <h2>Welcome</h2>

</html>
