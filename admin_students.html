<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registered Students</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #1677ff;
            color: white;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #dc3545;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .container {
            width: 95%;
            margin: 30px auto;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th {
            background: #1677ff;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f8ff;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #777;
        }
    </style>

</head>

<body>

    <div class="header">

        <h1>Registered Students</h1>

        <a href="{{ url_for('admin_dashboard') }}" class="back">
            Back to Dashboard
        </a>

    </div>


    <div class="container">

        <div class="box">

            <h2>Student Details</h2>

            <table>

                <thead>

                    <tr>
                        <th>Student ID</th>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Username</th>
                    </tr>

                </thead>

                <tbody>

                    {% if students %}

                        {% for student in students %}

                        <tr>

                            <td>{{ student[0] }}</td>

                            <td>{{ student[1] }}</td>

                            <td>{{ student[2] }}</td>

                            <td>{{ student[6] }}</td>

                        </tr>

                        {% endfor %}

                    {% else %}

                        <tr>

                            <td colspan="4" class="empty">
                                No registered students found.
                            </td>

                        </tr>

                    {% endif %}

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
